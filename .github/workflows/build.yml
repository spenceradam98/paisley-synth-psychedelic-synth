name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  VERSION: 0.1.0

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure (universal, macOS 10.13+)
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
      - name: Build
        run: cmake --build build --config Release --target Paisley_VST3 Paisley_AU Paisley_Standalone -- -quiet
      - name: Verify binaries run on macOS 11 (universal, minos <= 11.0)
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            minos=$(otool -arch all -l "$f" | awk '/LC_BUILD_VERSION/{m=1} /LC_VERSION_MIN_MACOSX/{v=1} m&&$1=="minos"{print $2; m=0} v&&$1=="version"{print $2; v=0}' | sort -V | tail -1)
            archs=$(lipo -archs "$f")
            echo "$f -> minos $minos, archs $archs"
            [ -n "$minos" ] && [ "$(printf '%s\n11.0\n' "$minos" | sort -V | tail -1)" = "11.0" ] || { echo "::error::$f needs macOS $minos"; fail=1; }
            case " $archs " in *x86_64*) ;; *) echo "::error::$f has no Intel slice"; fail=1;; esac
            case " $archs " in *arm64*) ;; *) echo "::error::$f has no Apple Silicon slice"; fail=1;; esac
          done < <(find build -path '*_artefacts/Release/*' -path '*/Contents/MacOS/*' -type f -print0)
          exit $fail
      - name: Check both architectures are present
        run: lipo -info build/Paisley_artefacts/Release/VST3/Paisley.vst3/Contents/MacOS/Paisley
      - name: Make DMG
        run: installer/mac/make-dmg.sh build/Paisley_artefacts/Release "$VERSION" dist
      - uses: actions/upload-artifact@v4
        with: { name: Paisley-macOS, path: dist/*.dmg }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release --target Paisley_VST3 Paisley_Standalone
      - name: Make installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyVersion=$env:VERSION" "/DArtefacts=$env:GITHUB_WORKSPACE\build\Paisley_artefacts\Release" "/O$env:GITHUB_WORKSPACE\dist" installer\windows\Paisley.iss
      - uses: actions/upload-artifact@v4
        with: { name: Paisley-Windows, path: dist/*.exe }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: "dist/*" }
